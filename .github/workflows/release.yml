name: Release

# Pushing a v* tag builds, signs and publishes the release that installed
# copies of Vault will auto-update from.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS 14+ runners are Apple Silicon; both targets are named so the
          # bundle is universal.
          - os: macos-latest
            args: '--target universal-apple-darwin'
            rust-targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
          - os: windows-latest
            args: '--bundles nsis'
            rust-targets: ''

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Vault ${{ github.ref_name }}'
          releaseBody: |
            **macOS** — download `Vault_universal.dmg` and drag it to Applications.
            **Windows** — download the `.exe` installer.

            Vault is signed for updates but not notarised with an Apple Developer
            ID, so the first launch on macOS needs **right-click → Open** (or
            `xattr -cr /Applications/Vault.app`). Later updates install silently.

            Phones do not need an install from here: open the hub's address in
            the browser and add it to the home screen.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
          # Produces latest.json, which the updater endpoint points at.
          includeUpdaterJson: true
